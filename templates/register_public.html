<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация като турист | Дивият Балкан</title>
  <link rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<main class="section container narrow">

  <h1>Регистрация като турист</h1>

  <form method="post">
    <label>Username
      <input name="username" required>
    </label>

    <label>E-mail
      <input name="email" type="email" required>
    </label>

    <label>Password
      <input name="password"
             type="password"
             minlength="8"
             required>
    </label>

    <button type="submit">Регистрация</button>
  </form>

  <p>
    <a href="{{ url_for('login') }}">← Към Login</a>
  </p>

</main>
</body>
</html>
